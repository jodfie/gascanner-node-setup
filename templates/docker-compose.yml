services:
  trunk-recorder:
    image: thegreatcodeholio/trunk-recorder-mqtt:RC5.0_organized
    container_name: trunk_recorder
    restart: unless-stopped
    privileged: true
    volumes:
      - ./tr_config:/app/tr_config:ro
      - ./tr_audio:/app/tr_audio
      - ./tr_logs:/app/tr_logs
      - /dev/bus/usb:/dev/bus/usb
      - /dev/shm:/dev/shm
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - TZ=America/New_York

# Standard GaScanner node transport is MQTT to mqtt.georgiascanner.live:1883.
# ThinLine Radio HTTP upload is not part of the default bootstrap path. Enable
# direct HTTP upload only if the admin specifically provides an API key and asks
# for dual publishing.
